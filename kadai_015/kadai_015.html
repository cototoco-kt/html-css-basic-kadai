<!DOCTYPE html>
<html>
<head>
  <title>15章課題</title>
  <meta charset="UTF-8">
  <meta name="description" content="このページは15章の課題です。">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans&display=swap" rel="stylesheet">
  <!-- Google Fonts読み込み
HTMLの<head>内にlinkタグを書く。
<link href="Google FontsのURL" rel="stylesheet">
↓
CSSでfont-familyを指定する。
font-family: "フォント名", sans-serif;
※preconnectはGoogle Fontsを早く読み込むための準備。
※crossoriginは別ドメインから読み込む設定。今は詳しく覚えなくてOK。 -->
</head>

<body>
<h1><span class="blue">M</span>Y<span class="pink">P</span>ROFILE</h1>

<!--
h1タグの中の一部分だけデザインを変えたい場合は、
spanタグで文字を囲み、classを付ける。

今回は、
M → class="blue"
P → class="pink"

として、それぞれCSSで文字色を指定する。

classが付いていない「Y」と「ROFILE」は、
h1やbodyなどに設定されている基本の文字色が反映される。
-->
  <div id="basic">
    <!-- basicというidの名前をつけたエリア -->
    <h2 class="pink">名前</h2>
    <p>侍　太郎</p>
    <h2 class="blue">生年月日</h2>
    <p>1990年1月1日</p>
    <h2 class="pink">血液型</h2>
    <p>O型</p>
  </div>
  <h2 class="blue">趣味</h2>
  <p>旅行、読書、ゲーム</p>
  <h2 class="pink">好きな食べ物</h2>
  <p>ハンバーグ、きつねうどん、抹茶アイス</p>
  <h2 class="blue">プログラミングを始めた理由</h2>
  <p>プログラマーとして転職したいから。<br>転職して数年後にはフリーランスになって、旅行しながら仕事したい！</p>
</body>
</html>
